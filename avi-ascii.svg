  <style>
    @keyframes cursor-blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    .cursor {
      animation: cursor-blink 1s infinite;
    }
    .ascii-text {
      fill: #8b949e;
      font-size: 9.5px;
      font-weight: 500;
      letter-spacing: 0px;
    }
